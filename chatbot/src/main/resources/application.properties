spring.application.name=chatbot
server.port=8089

# ---------- 登录鉴权 ----------
# 生产环境务必用环境变量 AUTH_TOKEN_SECRET 覆盖这个默认密钥（少于 32 字符会启动失败）
auth.token-secret=${AUTH_TOKEN_SECRET:chatbot-dev-only-token-secret-please-change-me}
auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:12}
# sys_user 为空时自动创建这个**超级管理员**（等价 sql/init.sql 的 INSERT IGNORE），不会覆盖已有账号
auth.default-admin-username=${AUTH_ADMIN_USERNAME:admin}
auth.default-admin-password=${AUTH_ADMIN_PASSWORD:admin}
# 每个角色补一个测试账号（test_super / test_admin / test_user / test_guest），用来验证「只能上对下」的层级权限。
# 只在用户名不存在时创建，不覆盖已有账号、不重置改过的密码。生产环境用 AUTH_SEED_TEST_USERS=false 关掉。
auth.seed-test-users=${AUTH_SEED_TEST_USERS:true}
auth.test-user-password=${AUTH_TEST_USER_PASSWORD:test123456}

# ---------- CORS ----------
# 允许跨域调用 /api 的前端源，逗号分隔可配多个。开发默认只有 Vite 的 5173；对外部署用 CORS_ALLOWED_ORIGINS 覆盖成真实域名。
# 留空（或全空白）后端启动直接失败：CORS 全开（*）只适合内网开发，不该是「配置漏写」的默认结果。
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- MySQL（请填写你自己的用户名 / 密码） ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chatbot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- 上传（图片附件） ----------
# 单个文件上限，和 AttachmentService.MAX_BYTES 是同一个数：超了这里给 413，AttachmentService 那道给中文 400 文案。
# max-request-size 留 1MB 余量给 multipart 边界与表单字段。
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:6MB}

# ---------- JPA ----------
# 表结构由 Hibernate 自动建 / 更新；SQL 日志默认关闭，调试时用 SHOW_SQL=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# ---------- LLM：百炼 DashScope（OpenAI 兼容模式） ----------
# 真实 key 别写进本文件（会提交进仓库），放 application-local.properties 或环境变量 LLM_API_KEY；留空则自动用本地 Mock
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.api-key=${LLM_API_KEY:}
llm.model=qwen3.6-flash
# 界面可选模型白名单（逗号分隔）。请求里带的 model 必须在这里面，否则 400；加模型改这里或环境变量 LLM_AVAILABLE_MODELS，不用改代码发版。
llm.available-models=${LLM_AVAILABLE_MODELS:qwen3.6-flash,qwen3.7-flash,qwen3.8-flash,qwen3.8-max}
# 思考开关（映射为请求体 enable_thinking，百炼 / Qwen 系参数）：true 时思考过程以 SSE reasoning 推给前端，false 时首字延迟降到秒级且省掉思考 token
# 这只是默认值，前端每条消息可传 enableThinking 单独覆盖；服务商不认识该字段时把下面这行整行注释掉
llm.enable-thinking=${LLM_ENABLE_THINKING:true}
# 整轮生成的总超时（秒），不是空闲超时；SSE 超时自动取它再加 30 秒
llm.request-timeout-seconds=${LLM_REQUEST_TIMEOUT:900}
# 支持图片输入（视觉理解）的模型，必须是 available-models 的子集；界面靠它决定显不显示「上传图片」按钮。
# 带图片的请求打到不在这里的模型会 400 并在文案里列出可用模型——比让百炼静默忽略图片好排查得多。
llm.vision-models=${LLM_VISION_MODELS:qwen3.6-flash,qwen3.7-flash,qwen3.8-flash,qwen3.8-max}
# 每轮最多送最近 N 条历史（条数上限）；<=0 表示不限制
llm.max-history-messages=${LLM_MAX_HISTORY:20}
# 历史上下文的 token 预算：从最近一条往前累加估算 token（中文约 1 字 1 token、其余约 4 字符 1 token），超预算就截断。
# 与 max-history-messages 是「谁先满足谁生效」；<=0 表示不限。思考过程也计入预算（它会随历史回传）。
llm.max-history-tokens=${LLM_MAX_HISTORY_TOKENS:24000}
