spring.application.name=chatbot
server.port=8089

# ---------- 错误响应 ----------
# 默认 never：前端遇到 404/400 只能拿到 status，看不到「会话不存在: 3」这种文案
server.error.include-message=always

# ---------- 登录鉴权 ----------
# 登录 token 的 HMAC-SHA256 签名密钥。泄露 = 任何人都能伪造登录态，
# 生产环境务必用环境变量 AUTH_TOKEN_SECRET 覆盖，别拿这个默认值上线（少于 32 字符会启动失败）
auth.token-secret=${AUTH_TOKEN_SECRET:chatbot-dev-only-token-secret-please-change-me}
# 登录态有效期（小时）。过期后接口返回 401，前端自动清掉本地登录态、弹回登录页
auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:12}
# 首次启动兜底：sys_user 表为空时自动创建这个管理员，等价于 sql/init.sql 里那条 INSERT IGNORE。
# 只在「一个用户都没有」时执行 —— 不会覆盖已有账号，也不会把谁改过的密码重置回 admin
auth.default-admin-username=${AUTH_ADMIN_USERNAME:admin}
auth.default-admin-password=${AUTH_ADMIN_PASSWORD:admin}

# ---------- MySQL（请填写你自己的用户名 / 密码） ----------
spring.datasource.url=jdbc:mysql://localhost:3306/chatbot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
# 表结构由 Hibernate 自动创建 / 更新；sql/init.sql 提供与之等价的建库 + 建表脚本（首次运行前先执行一次）
spring.jpa.hibernate.ddl-auto=update
# SQL 日志默认关闭（每条 SQL 都打太吵）；要看时用 SHOW_SQL=true 启动，或写进 application-local.properties
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# ---------- LLM：百炼 DashScope（OpenAI 兼容模式） ----------
# API Key 获取：阿里云百炼控制台 -> API-KEY 管理
# 注意：真实 API Key 不要写在本文件（会提交到仓库）！放 application-local.properties 或环境变量 LLM_API_KEY
# 填了 llm.api-key 走真实模型；留空自动使用本地 Mock（便于先跑通全链路）
llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
llm.api-key=${LLM_API_KEY:}
llm.model=qwen3.6-flash
# 推理模型的思考开关，映射为请求体顶层的 enable_thinking（百炼 / Qwen 系参数）
# true  = 允许思考。思考过程会以 SSE {"type":"reasoning","content":"..."} 实时推给前端，
#         界面能显示「思考中…」；更重要的是思考期间一直有字节流动，
#         不会被浏览器 / Vite 代理 / Nginx 常见的 60 秒空闲超时掐断连接
# false = 关闭思考。首字延迟从「思考完才开始」降到秒级，也省掉思考 token
#         （实测 qwen3.8-max 一轮思考 2.4 万字全部按输出计费，正式回答只有 1 个字）
# 换成不认识 enable_thinking 的服务商（OpenAI、DeepSeek 等）时，把下面这行整行注释掉，
# 后端就不下发该参数，请求体回到改造之前的样子
# 这里的配置只是默认值：前端每条消息可在请求体传 "enableThinking": true/false 单独开关思考，不传则用下面这行的默认值
llm.enable-thinking=${LLM_ENABLE_THINKING:true}
# 单次模型调用的总超时（秒），是「整轮生成」的上限而不是空闲超时。
# 原来写死 5 分钟：推理模型思考超过 5 分钟会在第 300 秒被 JDK HttpClient 直接关流，
# 实测思考到 31407 字、正式回答 0 字，全部作废但思考 token 照样计费。
# SSE 超时自动取这个值 + 30 秒，保证模型超时的错误文案能先送到前端。
llm.request-timeout-seconds=${LLM_REQUEST_TIMEOUT:900}
# 每轮只把最近 N 条历史送给模型，防止长会话把上下文窗口和 token 一起撑爆；<=0 表示不限制
llm.max-history-messages=${LLM_MAX_HISTORY:20}
